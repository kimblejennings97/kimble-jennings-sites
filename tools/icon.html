<!doctype html>
<!-- Home-screen icon for the landing page: a gold trophy under a stadium spotlight, "KJ" on the plate.
     Rendered to PNG by tools/make-icons.ps1 (headless Chrome). Square and full-bleed: iOS rounds the corners itself. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&display=block">
<style>html,body{margin:0;background:#070b14;overflow:hidden}svg{display:block;width:100vw;height:100vh}</style>
</head><body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#ffd23f" stop-opacity=".42"/><stop offset=".45" stop-color="#ffd23f" stop-opacity=".1"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213b"/><stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf" stop-opacity=".35"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9780a"/><stop offset=".3" stop-color="#ffe27a"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#c98a0c"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5806"/><stop offset=".4" stop-color="#e0a920"/><stop offset="1" stop-color="#8a5806"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stadium spotlights -->
  <path d="M60 -10 L150 -10 L300 420 L230 420 Z" fill="url(#beam)" opacity=".7"/>
  <path d="M452 -10 L362 -10 L282 420 L212 420 Z" fill="url(#beam)" opacity=".7"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- field line -->
  <ellipse cx="256" cy="452" rx="200" ry="26" fill="#ffd23f" opacity=".12"/>

  <!-- trophy -->
  <g>
    <!-- handles -->
    <path d="M162 150 C96 150 96 252 186 262" fill="none" stroke="url(#goldDark)" stroke-width="22" stroke-linecap="round"/>
    <path d="M350 150 C416 150 416 252 326 262" fill="none" stroke="url(#goldDark)" stroke-width="22" stroke-linecap="round"/>
    <!-- cup -->
    <path d="M150 120 L362 120 L356 190 C350 262 306 300 256 300 C206 300 162 262 156 190 Z" fill="url(#gold)"/>
    <rect x="144" y="108" width="224" height="22" rx="8" fill="url(#gold)"/>
    <!-- star -->
    <path d="M256 150 L267.6 180.1 L299.7 182.0 L274.8 202.4 L282.9 233.6 L256 216.2 L229.1 233.6 L237.2 202.4 L212.3 182.0 L244.4 180.1 Z" fill="#070b14" opacity=".82"/>
    <!-- shine -->
    <path d="M178 136 C176 190 188 240 214 272" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="9" stroke-linecap="round"/>
    <!-- stem -->
    <path d="M238 298 L274 298 L268 340 L244 340 Z" fill="url(#goldDark)"/>
    <rect x="216" y="336" width="80" height="16" rx="5" fill="url(#gold)"/>
    <!-- base with plate -->
    <path d="M178 352 L334 352 L346 418 L166 418 Z" fill="#1b2438"/>
    <rect x="160" y="414" width="192" height="18" rx="5" fill="url(#gold)"/>
    <rect x="206" y="364" width="100" height="42" rx="4" fill="url(#gold)"/>
    <text x="256" y="400" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="40" fill="#0b0f1a" letter-spacing="2">KJ</text>
  </g>
  <!-- sparkles -->
  <g fill="#fff3b0">
    <path d="M96 300 l6 -18 6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 Z" opacity=".85"/>
    <path d="M410 300 l4 -12 4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 Z" opacity=".75"/>
    <path d="M400 88 l3 -9 3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 Z" opacity=".6"/>
  </g>
</svg>
</body></html>
